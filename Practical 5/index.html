<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <div class="container">
        <h1>Student Registration Form</h1>

        <form id="registrationForm" novalidate>

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name">
                <small id="nameError"></small>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="Enter your email">
                <small id="emailError"></small>
            </div>

            <div class="form-group">
                <label for="mobile">Mobile Number</label>
                <input type="tel" id="mobile" placeholder="Enter 10-digit mobile number">
                <small id="mobileError"></small>
            </div>

            <div class="form-group">
    <label for="password">Password</label>

    <div class="password-box">
        <input type="password" id="password" placeholder="Enter password">
        <span class="eye" id="passwordEye">👁</span>
    </div>

    <div class="strength">
        <div id="strengthBar"></div>
    </div>

    <small id="passwordError"></small>
</div>

<div class="form-group">
    <label for="confirmPassword">Confirm Password</label>

    <div class="password-box">
        <input type="password" id="confirmPassword" placeholder="Confirm password">
        <span class="eye" id="confirmEye">👁</span>
    </div>

    <small id="confirmPasswordError"></small>
</div>

            <div class="form-group">
                <label for="course">Course</label>
                <select id="course">
                    <option value="">Select Course</option>
                    <option value="B.Tech IT">B.Tech IT</option>
                    <option value="B.Tech CSE">B.Tech CSE</option>
                    <option value="BCA">BCA</option>
                    <option value="MCA">MCA</option>
                </select>
                <small id="courseError"></small>
            </div>

            <div class="form-group">
                <label for="year">Year</label>
                <select id="year">
                    <option value="">Select Year</option>
                    <option value="1">1st Year</option>
                    <option value="2">2nd Year</option>
                    <option value="3">3rd Year</option>
                    <option value="4">4th Year</option>
                </select>
                <small id="yearError"></small>
            </div>

            <fieldset>
                <legend>Gender</legend>

                <label class="radio-label">
                    <input type="radio" name="gender" value="Male">
                    Male
                </label>

                <label class="radio-label">
                    <input type="radio" name="gender" value="Female">
                    Female
                </label>

                <label class="radio-label">
                    <input type="radio" name="gender" value="Other">
                    Other
                </label>

                <small id="genderError"></small>
            </fieldset>

            <div class="terms">
                <label>
                    <input type="checkbox" id="terms">
                    I accept the terms and conditions
                </label>
                <small id="termsError"></small>
            </div>

            <button type="submit" class="register-btn">
                Register
            </button>

            <p id="successMessage"></p>

        </form>
    </div>

    <script src="index.js"></script>
</body>
</html>
